<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Collage Interactive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Text Collage Interactive</h1>
        
        <!-- Text Selection Area -->
        <div class="text-selector">
            <h3 class="selector-title">Display Text:</h3>
            <div class="selector-buttons">
                <button class="selector-btn active" data-text="medea">Medea</button>
                <button class="selector-btn" data-text="mulan">The Ballad of Mulan</button>
            </div>
        </div>
        
        <!-- Instructions -->
        <div class="instructions">
            <p>Drag word images from the bottom boxes onto the text above to complete the collage.</p>
        </div>
        
        <!-- 主图片展示区域 -->
        <div class="text-display">
            <!-- Medea 主图片 -->
            <div class="main-image-container medea">
                <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/dd9f0ef85f5b465781a4688597657241.jpg~tplv-a9rns2rl98-24:720:720.jpg?lk3s=8e244e95&amp;rcl=20260322102425819047BF52E83CA2B8DD&amp;rrcfp=8a172a1a&amp;x-expires=1774751066&amp;x-signature=zDV3RZ2JbR6Ay8vMgY%2B%2Fac%2Bj2kY%3D" alt="Medea Text Collage" class="main-image">
                <!-- 这里是可拖拽区域，用户可以将词语图片拖放到这里 -->
                <div class="drop-zone"></div>
            </div>
            
            <!-- Mulan 主图片 -->
            <div class="main-image-container mulan" style="display: none;">
                <img src="https://p5-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/code_assistant/69dca6cd1c004b5b92f9c91683786092~tplv-a9rns2rl98-image.image?lk3s=8e244e95&amp;rcl=202603221052509FD647F7756D9E8E9DB2&amp;rrcfp=e75484ac&amp;x-expires=1774752774&amp;x-signature=FN4uEYRfTFLKpINq%2BIotFT8oJYA%3D" alt="Mulan Text Collage" class="main-image">
                <!-- 这里是可拖拽区域，用户可以将词语图片拖放到这里 -->
                <div class="drop-zone"></div>
            </div>
        </div>
        
        <!-- Word Boxes Area -->
        <div class="word-cards">
            <!-- Gendered Pronouns Area -->
            <div class="word-category">
                <div class="category-header">
                    <h3 class="category-title">Gendered Pronouns</h3>
                    <div class="word-source-controls">
                        <span class="source-label">Source:</span>
                        <button class="word-source-btn active" data-source="medea" data-category="pronouns">Medea</button>
                        <button class="word-source-btn" data-source="mulan" data-category="pronouns">Mulan</button>
                    </div>

                </div>
                <div class="word-container" id="pronouns-container">
                    <!-- Medea Pronoun Boxes (11) -->
                    <div class="word-boxes medea-pronouns">
                        <!-- Will be dynamically generated by JavaScript -->
                    </div>
                    
                    <!-- Mulan Pronoun Boxes (45) -->
                    <div class="word-boxes mulan-pronouns" style="display: none;">
                        <!-- Will be dynamically generated by JavaScript -->
                    </div>
                </div>
            </div>
            
            <!-- Verbs Area -->
            <div class="word-category">
                <div class="category-header">
                    <h3 class="category-title">Verbs</h3>
                    <div class="word-source-controls">
                        <span class="source-label">Source:</span>
                        <button class="word-source-btn active" data-source="medea" data-category="verbs">Medea</button>
                        <button class="word-source-btn" data-source="mulan" data-category="verbs">Mulan</button>
                    </div>

                </div>
                <div class="word-container" id="verbs-container">
                    <!-- Medea Verb Boxes (14) -->
                    <div class="word-boxes medea-verbs">
                        <!-- Will be dynamically generated by JavaScript -->
                    </div>
                    
                    <!-- Mulan Verb Boxes (63) -->
                    <div class="word-boxes mulan-verbs" style="display: none;">
                        <!-- Will be dynamically generated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Reset Button -->
        <div class="reset-container">
            <button class="reset-btn">Reset All</button>
        </div>
    </div>

    <script src="script.js"></script>

</body></html>
